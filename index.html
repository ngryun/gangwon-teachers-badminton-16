<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3f5e">
<title>강원 교직원배드민턴대회 경기일정</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root{--bg:#f2f5f9;--bg-blur:rgba(242,245,249,.92);--card:#fff;--ink:#16222f;--sub:#647488;--line:#dfe6ee;--accent:#155d88;--on-accent:#fff;--accent-soft:#eaf2f8;--edge:#c3d5e2;--deep:#0f3f5e;--teal:#138e98;--sun:#e09a3c;--time:#0f3f5e;--ko:#9a5a0c;--ko-soft:#fdf3e3;--chip:#e9eef4;--past:#aab6c3;--star:#c27a17;--shadow:0 2px 10px rgba(31,55,85,.06);--shadow-lg:0 10px 30px rgba(31,56,90,.12)}
@media (prefers-color-scheme: dark){:root{--bg:#0d141b;--bg-blur:rgba(13,20,27,.92);--card:#16202a;--ink:#e6edf3;--sub:#93a3b3;--line:#273441;--accent:#62b5e2;--on-accent:#06202e;--accent-soft:#12303f;--edge:#2c4a5e;--deep:#0b2e45;--teal:#0f6f78;--sun:#e8a94e;--time:#e6edf3;--ko:#f0b060;--ko-soft:#3a2c17;--chip:#1e2a36;--past:#566575;--star:#f0b060;--shadow:none;--shadow-lg:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:-22px auto 0;padding:0 max(14px,env(safe-area-inset-right,0px)) 72px max(14px,env(safe-area-inset-left,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bibar{background:#fff;border-bottom:1px solid var(--line)}
.bibar-in{max-width:760px;margin:0 auto;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));padding-top:max(8px,env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.bi{height:38px;width:auto;display:block;flex:none}
.bimeta{font-size:12px;font-weight:700;color:#647488;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hero{background:linear-gradient(135deg,var(--deep),#155d88 55%,var(--teal));color:#fff;padding:22px 0 44px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;border:26px solid rgba(255,255,255,.07);pointer-events:none}
.hero-in{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));position:relative;z-index:1}
.eyebrow{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;opacity:.85}
.hero h1{margin:6px 0 0;font-size:clamp(24px,6.4vw,32px);line-height:1.2;font-weight:800;letter-spacing:-.02em}
.meet{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:12px 0 0;font-size:13px}
.meet span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-weight:600}
.meet .dday{background:var(--sun);color:#3a2503;font-weight:800}
.finder{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow-lg);position:relative;z-index:2}

.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 40px 12px 40px;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(21,93,136,.14)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--sub);font-size:18px;display:none}
.search.has .clr{display:block}
.sug{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;box-shadow:var(--shadow)}
.sug:empty{display:none}
.sug button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;min-height:44px}
.sug button:last-child{border-bottom:0}
.sug button:active{background:var(--accent-soft)}
.sug .tg{flex:none;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px}
.sug b{font-weight:700}
.sug span.d{color:var(--sub);font-size:13px;margin-left:auto;text-align:right}
.sug .none{padding:12px 14px;color:var(--sub);font-size:14px}

.favs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px}
.favs:empty{display:none}
.favs .lb{color:var(--star);font-weight:700}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin-top:12px}
.tabs button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:700;color:var(--sub);min-height:44px}
.tabs button{transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(15,63,94,.25)}
.panel{padding:12px 2px 2px}
.panel h2{font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 6px}
.panel h2:first-child{margin-top:0}
.hint{color:var(--sub);font-size:13px;margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.grid .chip{white-space:nowrap;padding-inline:6px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:38px;padding:6px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;font-weight:600;line-height:1.2;text-align:center;transition:background .15s,border-color .15s}
@media (hover:hover){.chip:hover{background:var(--accent-soft);border-color:var(--edge)}}
.chip small{color:var(--sub);font-size:11px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.chip.q{border-style:dashed}
.evrow{display:grid;grid-template-columns:98px 1fr;gap:8px;align-items:start;margin-top:6px}
.evrow>span{font-size:13px;font-weight:600;padding-top:9px}
.cho{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cho .chip{padding:6px 0;min-width:0}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px;max-height:46vh;overflow:auto;overscroll-behavior:contain;padding-right:2px}
.names button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:7px 10px;min-height:44px}
.names button b{font-size:15px}
.names button span{font-size:12px;color:var(--sub)}

.bar{position:sticky;top:0;z-index:5;background:var(--bg-blur);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin:14px -14px 0;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .act{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:700;min-height:32px}
.tag i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.22);font-size:12px}
.bar .all{color:var(--sub);font-size:13px;font-weight:600;padding:5px 0}
.reset{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--sub);min-height:32px;white-space:nowrap}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;flex:none}
.seg button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--sub);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.sum{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.sum:empty{display:none}
.sum .top{display:flex;align-items:flex-start;gap:8px}
.sum h2{font-size:19px;margin:0;flex:1;line-height:1.3}
.sum h2 small{font-size:13px;font-weight:500;color:var(--sub);margin-left:4px}
.sum .ib{flex:none;border:1px solid var(--line);background:var(--card);border-radius:9px;min-width:40px;height:36px;padding:0 9px;font-size:13px;color:var(--sub)}
.sum .ib.on{color:var(--star);border-color:var(--star);font-weight:700}
.sum p{margin:6px 0 0;color:var(--sub);font-size:13px}
.sum p b{color:var(--ink)}
.ent{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.ent .ttl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--accent-soft);color:var(--accent)}
.badge.ko{background:var(--ko-soft);color:var(--ko)}
.lnk{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.path{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.path h3{font-size:12px;margin:0 0 4px;color:var(--ko)}
.path ol{list-style:none;margin:0;padding:0;font-size:13px}
.path li{display:grid;grid-template-columns:36px 1fr;gap:0 8px;padding:4px 0;align-items:baseline}
.path li+li{border-top:1px dashed var(--line)}
.path li b{color:var(--ko)}
.path li em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}
.path li span{grid-column:2;color:var(--sub)}
details.grp{margin-top:10px;font-size:13px}
details.grp summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
.grp dl{margin:4px 0 0;display:grid;gap:8px}
.grp dt{font-weight:700;font-size:12px;color:var(--sub)}
.grp dd{margin:2px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px}

.cnt{color:var(--sub);font-size:13px;margin:14px 2px 0}
.fc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--ko-soft);border:1px solid color-mix(in srgb,var(--sun) 45%,transparent);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;color:var(--ink)}
.fc p{margin:0;flex:1 1 220px}
.fc b{color:var(--ko)}
.fc a,.fclink{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.fc a{background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:7px 12px;min-height:36px}
.fc a:after,.fclink:after{content:'↗';font-size:11px;opacity:.8}
.path+.fclink,.fclink{margin-top:8px;font-size:13px}
.day{font-size:15px;font-weight:800;margin:20px 2px 8px;display:flex;gap:8px;align-items:center}
.day:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--sun);flex:none}
.day small{color:var(--sub);font-weight:400}
.list{display:grid;gap:8px}
.m{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:62px 1fr;gap:10px;box-shadow:var(--shadow)}
.m.ko{border-left-color:var(--sun)}
.m.past{border-left-color:var(--past)}
.m.past .when,.m.past .side{opacity:.55}
.m.next{outline:2px solid var(--accent);outline-offset:-1px}
.when{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.when b{font-size:19px;font-weight:800;color:var(--time);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.when .ct{font-size:12px;font-weight:700;background:var(--chip);border:0;border-radius:6px;padding:2px 6px}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.courts .chip{flex-direction:column;gap:0;padding:6px 2px;white-space:nowrap}
.when .no{font-size:11px;color:var(--sub)}
.body{min-width:0}
.ev{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:5px}
.ev .lnk{font-weight:600}
.side{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:5px 8px;border-radius:8px}
.side+.side{margin-top:3px;border-top:1px dashed var(--line);border-top-left-radius:0;border-top-right-radius:0}
.side .tm{font-weight:800;font-size:15px}
.side .rg{font-size:11px;color:var(--sub)}
.side .pl{font-size:14px;color:var(--sub);margin-left:auto;text-align:right}
.side.me{background:var(--accent-soft)}
.side.me+.side,.side+.side.me{border-top-color:transparent}
.side.me .tm{color:var(--accent)}
.side .pl .me{color:var(--ink);font-weight:700}
.side.seed .tm{font-weight:600;font-size:14px}
.more{display:block;width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;color:var(--accent);min-height:46px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--sub);margin-top:12px}
footer{margin-top:28px;color:var(--sub);font-size:12px;line-height:1.6}
footer p{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:.95}
@media (min-width:600px){
  .m{grid-template-columns:78px 1fr}
}
</style>
</head>
<body>
<div class="bibar"><div class="bibar-in">
  <img class="bi" src="bi.png" width="1285" height="459" decoding="async" alt="모두가 빛나는 강원교육">
  <span class="bimeta">2026. 11. 21.(토) ~ 22.(일)</span>
</div></div>
<header class="hero"><div class="hero-in">
  <p class="eyebrow">제16회 강원특별자치도</p>
  <h1>교직원배드민턴대회 경기일정</h1>
  <p class="meet"><span class="dday" id="dday"></span><span>삼척시다목적체육관</span><span>21일(토) 예선 · 22일(일) 본선</span></p>
</div></header>
<div class="wrap">
  <div class="finder">
  <div class="search" id="searchBox">
    <span class="ico" aria-hidden="true">🔍</span>
    <label class="vh" for="q">이름, 학교, 종목 검색</label>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="이름 · 학교 · 종목 검색">
    <button class="clr" id="qClear" type="button" aria-label="검색어 지우기">✕</button>
  </div>
  <div class="sug" id="sug"></div>
  <div class="favs" id="favs"></div>

  <div class="tabs" role="tablist" aria-label="조회 기준">
    <button role="tab" id="tab-r" data-tab="r" aria-controls="panel">지역별</button>
    <button role="tab" id="tab-p" data-tab="p" aria-controls="panel">교사별</button>
    <button role="tab" id="tab-e" data-tab="e" aria-controls="panel">종목별</button>
    <button role="tab" id="tab-c" data-tab="c" aria-controls="panel">코트별</button>
  </div>
  <div class="panel" id="panel" role="tabpanel"></div>
  </div>

  <div class="bar" id="bar">
    <div class="act" id="act"></div>
    <div class="seg" role="group" aria-label="날짜">
      <button type="button" data-day="">전체</button>
      <button type="button" data-day="11-21">21 토</button>
      <button type="button" data-day="11-22">22 일</button>
    </div>
  </div>

  <section class="sum" id="sum" aria-live="polite"></section>
  <p class="cnt" id="cnt"></p>
  <div id="res"></div>

  <footer>
    <p><span id="note"></span> <a class="fclink" href="https://www.facecock.co.kr/page/?pid=game_court&ga_id=4395&gg_id=7043" target="_blank" rel="noopener">페이스콕 코트별 진행 현황</a></p>
    <p>대회 운영본부가 배포한 「경기 대진표 및 경기 시간」 자료를 옮긴 것입니다. 현장 사정으로 시간·코트가 바뀔 수 있으니 본부 안내를 함께 확인하세요.</p>
    <p>지역은 대회 참가현황의 교육지원청 단위입니다. 대진표에는 지역이 없어 따로 붙였고, 참가현황의 지역별 팀 수와 대조해 맞췄습니다.</p>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>
(function(){
'use strict';
var D = window.DATA, YEAR = 2026;
var TEAMS = D.teams, EVENTS = D.events, MATCHES = D.matches;
var REGION_ORDER = ['춘천','원주','강릉','속초양양','동해','태백','삼척','홍천','횡성','영월','평창','정선','철원','화천','양구','인제','고성','도교육청'];
var UNKNOWN = '확인 필요';
var FACECOCK = 'https://www.facecock.co.kr/page/?pid=game_court&ga_id=4395&gg_id=7043';
function fcNotice(text){
  return '<div class="fc"><p>' + text + '</p><a href="' + FACECOCK + '" target="_blank" rel="noopener">페이스콕에서 확인</a></div>';
}
var DOW = ['일','월','화','수','목','금','토'];
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- 자료 엮기: 출전 조(복식 한 팀) · 사람 · 소속 ---------- */
var ENTRIES = [], entryIdx = {}, PEOPLE = {}, PEOPLE_LIST = [];
TEAMS.forEach(function(t, i){ t.i = i; t.entries = []; t.region = t.r || UNKNOWN; });
MATCHES.forEach(function(m, i){
  m.i = i;
  var p = m.d.split('-'), h = m.t.split(':');
  m.ms = Date.UTC(YEAR, p[0] - 1, +p[1], h[0] - 9, +h[1]);
  if (m.k) return;
  ['a','b'].forEach(function(s){
    var pl = m[s + 'p'], key = m.e + '|' + (m.g || '') + '|' + m[s] + '|' + pl.slice().sort().join(',');
    var x = entryIdx[key];
    if (x === undefined) {
      x = entryIdx[key] = ENTRIES.length;
      ENTRIES.push({ i: x, e: m.e, g: m.g || '', team: m[s], players: pl.slice(), matches: [] });
      TEAMS[m[s]].entries.push(x);
      pl.forEach(function(name){
        var pk = name + '@' + TEAMS[m[s]].n;
        if (!PEOPLE[pk]) { PEOPLE[pk] = { key: pk, name: name, team: m[s], entries: [] }; PEOPLE_LIST.push(PEOPLE[pk]); }
        PEOPLE[pk].entries.push(x);
      });
    }
    ENTRIES[x].matches.push(m);
    m['e' + s] = x;
  });

  return '<div class="side' + (mine ? ' me' : '') + '"><button type="button" class="lnk tm" data-team="' + t.i + '">' + esc(t.n) + '</button><span class="rg">' + esc(t.r || '') + '</span>' +
    '<span class="pl">' + m[s + 'p'].map(function(n){
      return '<button type="button" class="lnk' + (mine && me === n ? ' me' : '') + '" data-person="' + esc(n + '@' + t.n) + '">' + esc(n) + '</button>';
    }).join(' · ') + '</span></div>';
}
function renderList(list){
  var now = Date.now(), h = '', day = null, shown = list.slice(0, limit);
  var focused = state.p || state.s !== null, nextId = -1;
  if (focused) for (var i = 0; i < list.length; i++) if (list[i].ms + 20 * 60000 > now) { if (now > list[0].ms - 36 * 3600000) nextId = list[i].i; break; }
  shown.forEach(function(m){
    if (m.d !== day) {
      if (day !== null) h += '</div>';
      day = m.d;
      h += '<h3 class="day">' + dayLabel(m.d) + ' <small>' + list.filter(function(x){ return x.d === m.d; }).length + '경기</small></h3><div class="list">';
    }
    var past = m.ms + 20 * 60000 < now;
    h += '<article class="m' + (m.k ? ' ko' : '') + (past ? ' past' : '') + (m.i === nextId ? ' next' : '') + '">' +
      '<div class="when"><b>' + m.t + '</b><button type="button" class="ct" data-court="' + m.c + '" aria-label="' + m.c + '코트 경기 보기">' + m.c + '코트</button><span class="no">' + m.n + '번 경기</span></div>' +
      '<div class="body"><div class="ev">' + (m.i === nextId ? '<span class="badge">다음 경기</span>' : '') +
      '<button type="button" class="lnk" data-event="' + m.e + '" data-g="' + esc(m.k ? '본선' : (m.g || '')) + '">' + esc(EVENTS[m.e]) + '</button>' +
      (m.k ? '<span class="badge ko">' + esc(m.r) + '</span>' : '<span class="badge">' + esc(groupLabel(m.g)) + '</span>') + '</div>' +
      sideHtml(m, 'a') + sideHtml(m, 'b') + '</div></article>';
  });
  if (day !== null) h += '</div>';
  if (list.length > shown.length) h += '<button type="button" class="more" data-act="more">더 보기 (' + (list.length - shown.length) + '경기 남음)</button>';
  var teamView = state.p || state.s !== null || state.r !== null;
  if (!list.length) {
    h = (state.d === '11-22' && teamView)
      ? '<div class="empty">22일 본선은 예선 결과에 따라 대진이 정해져, 여기서는 팀별로 보여 드릴 수 없습니다.<br>본선 시간·코트 틀은 종목별 → ‘본선’에서 볼 수 있습니다.</div>'
      : '<div class="empty">조건에 맞는 경기가 없습니다.' + (state.d ? '<br>날짜를 ‘전체’로 바꿔 보세요.' : '') + '</div>';
  }
  if (state.d === '11-22' || list.some(function(m){ return m.k; }))
    h = fcNotice('<b>본선</b>은 예선 결과에 따라 올라가는 팀이 정해집니다. 여기에는 시간·코트와 ‘A조 1위’ 같은 자리만 나오고, <b>실제 대진과 결과</b>는 페이스콕에서 확인하세요.') + h;
  $('res').innerHTML = h;
  var filtered = state.p || state.s !== null || state.r !== null || state.e !== null || state.c !== null;
  $('cnt').textContent = (filtered ? '' : '시간순 전체 일정 · ') + list.length + '경기' + ((state.p || state.s !== null || state.r !== null) && !state.d ? ' (예선 기준 · 본선은 조 순위에 따라 결정)' : '');
}
function renderFavs(){
  var f = favs().filter(function(id){ return id.charAt(0) === 'p' ? PEOPLE[id.slice(2)] : TEAM_BY_NAME[id.slice(2)]; });
  $('favs').innerHTML = f.length ? '<span class="lb">★ 내 즐겨찾기</span>' + f.map(function(id){
    if (id.charAt(0) === 'p') { var p = PEOPLE[id.slice(2)]; return chip(p.name, state.p === p.key, 'data-person="' + esc(p.key) + '"', TEAMS[p.team].n); }
    var t = TEAM_BY_NAME[id.slice(2)]; return chip(t.n, state.s === t.i, 'data-team="' + t.i + '"');
  }).join('') : '';
}
function render(){
  renderPanel(); renderBar(); renderFavs();
  var list = selectMatches();
  renderSummary(list); renderList(list);
}

/* ---------- 검색 ---------- */
function norm(s){ return s.replace(/\s+/g, '').toLowerCase(); }
function renderSug(){
  var q = norm($('q').value), box = $('sug');
  $('searchBox').classList.toggle('has', !!$('q').value);
  if (!q) { box.innerHTML = ''; return; }
  var h = [], max = 30;
  function rank(name){ var i = norm(name).indexOf(q); return i < 0 ? -1 : (i === 0 ? 0 : 1); }
  var ppl = PEOPLE_LIST.map(function(p){ return [rank(p.name), p]; }).filter(function(x){ return x[0] >= 0; }).sort(function(a, b){ return a[0] - b[0]; });
  var tms = TEAMS.map(function(t){ return [rank(t.n), t]; }).filter(function(x){ return x[0] >= 0; }).sort(function(a, b){ return a[0] - b[0]; });
  var regs = REGIONS.filter(function(r){ return rank(r.name) === 0; });
  var evs = EVENTS.map(function(n, e){ return [rank(n), e]; }).filter(function(x){ return x[0] >= 0; });
  regs.forEach(function(r){ h.push('<button type="button" data-region="' + esc(r.name) + '" data-keep="1"><span class="tg">지역</span><b>' + esc(r.name) + '</b><span class="d">소속 ' + r.teams.length + '곳</span></button>'); });
  ppl.slice(0, 20).forEach(function(x){ var p = x[1]; h.push('<button type="button" data-person="' + esc(p.key) + '"><span class="tg">교사</span><b>' + esc(p.name) + '</b><span class="d">' + esc(TEAMS[p.team].n) + ' · ' + esc(p.entries.map(function(i){ return EVENTS[ENTRIES[i].e]; }).join(', ')) + '</span></button>'); });
  tms.slice(0, 12).forEach(function(x){ var t = x[1]; h.push('<button type="button" data-team="' + t.i + '"><span class="tg">소속</span><b>' + esc(t.n) + '</b><span class="d">' + esc(t.r || '지역 확인 필요') + ' · ' + t.entries.length + '팀</span></button>'); });
  evs.slice(0, 8).forEach(function(x){ h.push('<button type="button" data-event="' + x[1] + '" data-g=""><span class="tg">종목</span><b>' + esc(EVENTS[x[1]]) + '</b><span class="d">' + EVENT_GROUPS[x[1]].entries.length + '팀</span></button>'); });
  var extra = Math.max(0, ppl.length - 20) + Math.max(0, tms.length - 12);
  box.innerHTML = h.length ? h.slice(0, max).join('') + (extra ? '<div class="none">외 ' + extra + '건 — 검색어를 더 입력해 보세요.</div>' : '') : '<div class="none">‘' + esc($('q').value) + '’ 검색 결과가 없습니다.</div>';
}
function clearSearch(){ $('q').value = ''; renderSug(); }

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if (!b) return;
  var d = b.dataset, inSug = !!b.closest('#sug');
  if (d.tab) { update({ tab: d.tab }); return; }
  if (d.cho) { update({ cho: state.cho === d.cho ? null : d.cho }); return; }
  if (d.day !== undefined) { update({ d: d.day }); return; }
  if (d.clear) {
    if (d.clear === 'p') update({ p: null });
    else if (d.clear === 'r') update({ r: null, s: null });
    else if (d.clear === 's') update({ s: null });
    else if (d.clear === 'c') update({ c: null });
    else update({ e: null, g: null });
    return;
  }
  if (d.court) {
    if (b.closest('#panel')) pick.court(+d.court);
    else update({ tab: 'c', c: +d.court, p: null, r: null, s: null, e: null, g: null }, { scroll: true });
    return;
  }
  if (d.act === 'reset') { update({ r: null, s: null, p: null, e: null, g: null, c: null }); return; }
  if (d.act === 'more') { limit += STEP; renderList(selectMatches()); return; }
  if (d.act === 'fav') { toggleFav(); return; }
  if (d.act === 'share') {
    var url = location.href;
    if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) { navigator.share({ title: document.title, url: url }).catch(function(){}); }
    else if (navigator.clipboard) { navigator.clipboard.writeText(url).then(function(){ toast('링크를 복사했습니다'); }, function(){ toast('복사하지 못했습니다'); }); }
    else toast('주소창의 주소를 복사해 주세요');
    return;
  }
  if (d.region) { if (inSug) { clearSearch(); update({ tab: 'r', r: d.region, s: null, p: null, e: null, g: null, c: null }); } else pick.region(d.region); return; }
  if (d.person) { if (inSug) clearSearch(); pick.person(d.person); return; }
  if (d.team !== undefined) {
    if (inSug) { clearSearch(); update({ tab: 'r', r: TEAMS[+d.team].region, s: +d.team, p: null, e: null, g: null, c: null }, { scroll: true }); }
    else if (b.classList.contains('chip') && b.closest('#panel')) pick.team(+d.team);
    else update({ tab: 'r', r: TEAMS[+d.team].region, s: +d.team, p: null, e: null, g: null, c: null }, { scroll: true });
    return;
  }
  if (d.event !== undefined) {
    var e = +d.event;
    if (inSug) { clearSearch(); update({ tab: 'e', e: e, g: null, p: null, r: null, s: null, c: null }, { scroll: true }); }
    else if (b.closest('#panel')) pick.event(e);
    else if (b.closest('#sum') && b.classList.contains('chip')) update({ e: e, g: d.g || null });
    else update({ tab: 'e', e: e, g: d.g || null, p: null, r: null, s: null, c: null }, { scroll: true });
    return;
  }
});
$('q').addEventListener('input', renderSug);
$('q').addEventListener('keydown', function(ev){
  if (ev.key === 'Enter') { var first = $('sug').querySelector('button'); if (first) { first.click(); $('q').blur(); } }
  if (ev.key === 'Escape') clearSearch();
});
$('qClear').addEventListener('click', function(){ clearSearch(); $('q').focus(); });
window.addEventListener('popstate', function(){ readHash(); limit = STEP; render(); });
window.addEventListener('hashchange', function(){ readHash(); limit = STEP; render(); });

/* ---------- 머리말 ---------- */
(function(){
  var kst = new Date(Date.now() + 9 * 3600000), today = Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate());
  var d1 = Date.UTC(YEAR, 10, 21), d2 = Date.UTC(YEAR, 10, 22), n = Math.round((d1 - today) / 86400000);
  $('dday').textContent = today < d1 ? 'D-' + n : today === d1 ? '오늘 · 1일차 예선' : today === d2 ? '오늘 · 2일차 본선' : '대회 종료';
  $('note').textContent = (D.notes || []).join(' ');
})();
readHash();
render();
setInterval(function(){ if (!document.hidden) renderList(selectMatches()); }, 60000);
})();
</script>
</body>
</html>
